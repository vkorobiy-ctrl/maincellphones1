<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16141c;
    --graphite:#666270;
    --line:#e8e7ec;
    --soft:#f4f4f7;
    --signal:#1b4dff;
    --signal-hover:#1740d6;
    --star:#f5a300;
    --ok:#0f9d58;
    --shell:1240px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
  html,body{margin:0}
  body{
    background:var(--page-base);min-height:100vh;color:var(--ink);
    font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  img{max-width:100%}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:10px}

  /* ================= header ================= */
  header{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:var(--bar-bg);backdrop-filter:saturate(170%) blur(16px);-webkit-backdrop-filter:saturate(170%) blur(16px);
    border-bottom:1px solid var(--bar-line);transition:background .35s,border-color .35s;
  }
  .bar{max-width:var(--shell);margin:0 auto;padding:12px 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
  .wordmark{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.03em;font-size:1.125rem;color:var(--bar-ink)}
  .wordmark span{font-weight:500;color:var(--bar-muted)}
  .bar-actions{display:flex;align-items:center;gap:10px;justify-self:end}

  .filters{display:flex;gap:2px;background:var(--chip-bg);border:1px solid var(--chip-line);padding:4px;border-radius:999px}
  .chip{background:transparent;border:0;padding:7px 15px;border-radius:999px;font-size:.9rem;font-weight:600;color:var(--bar-muted);white-space:nowrap;transition:background .2s,color .2s}
  .chip:hover{color:var(--bar-ink)}
  .chip[aria-pressed="true"]{background:var(--chip-on-bg);color:var(--chip-on-fg)}

  .cart-btn{display:inline-flex;align-items:center;gap:9px;background:var(--cart-bg);color:var(--cart-fg);border:0;padding:8px 8px 8px 15px;border-radius:999px;font-weight:600;font-size:.9375rem;transition:background .2s}
  .cart-btn:hover{background:var(--cart-hover)}
  .cart-btn svg{width:18px;height:18px}
  .count{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--cart-fg);color:var(--cart-bg);display:grid;place-items:center;font-size:.8125rem;font-weight:700;font-variant-numeric:tabular-nums}
  .count.bump{animation:bump .45s ease}
  @keyframes bump{40%{transform:scale(1.35)}}

  .theme{position:relative}
  .theme-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--bar-line);padding:3px;background:transparent;display:grid;place-items:center}
  .theme-btn span{width:100%;height:100%;border-radius:50%;background:var(--page-bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
  .theme-btn:hover{border-color:var(--bar-muted)}
  .theme-pop{position:absolute;right:0;top:calc(100% + 10px);width:244px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 24px 50px rgba(20,18,30,.22);display:none}
  .theme-pop.open{display:block}
  .theme-pop p{margin:0 0 12px;font-size:.875rem;font-weight:700}
  .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .theme-opt{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--graphite)}
  .theme-opt i{width:56px;height:56px;border-radius:16px;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .15s}
  .theme-opt:hover i{transform:scale(1.05)}
  .theme-opt[aria-checked="true"]{color:var(--ink);font-weight:700}
  .theme-opt[aria-checked="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}

  /* ================= intro ================= */
  .intro{max-width:var(--shell);margin:0 auto;padding:34px 20px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .intro h1{margin:0;color:var(--on-bg);font-size:clamp(2rem,4.2vw,3rem);line-height:1;letter-spacing:-.045em;font-weight:800}
  .intro p{margin:8px 0 0;color:var(--on-bg-muted);font-size:1.0625rem}
  .perks{display:flex;gap:18px;flex-wrap:wrap;margin:0;padding:0;list-style:none;color:var(--on-bg-muted);font-size:.9rem;font-weight:500}
  .perks li{display:flex;align-items:center;gap:7px}
  .perks svg{width:17px;height:17px;flex:none}

  /* ================= configurator ================= */
  .shop{max-width:var(--shell);margin:0 auto;padding:0 20px 80px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}

  /* stage (left) */
  .stage{
    --tint:#c9ccd4;
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);
    height:clamp(480px,calc(100vh - 110px),680px);
    border-radius:32px;overflow:hidden;
    background:#f3f4f7;
    background:
      radial-gradient(55% 48% at 50% 50%, color-mix(in srgb,var(--tint) 55%,transparent) 0%, transparent 75%),
      linear-gradient(180deg,#ffffff 0%,#eceef3 100%);
    box-shadow:0 30px 60px -30px rgba(20,18,40,.35);
    transition:background .6s ease;
    display:flex;flex-direction:column;
  }
  .big-num{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);
    font-size:clamp(14rem,34vw,32rem);font-weight:800;letter-spacing:-.08em;line-height:1;
    color:color-mix(in srgb,var(--tint) 30%,transparent);
    pointer-events:none;user-select:none;transition:color .6s ease;white-space:nowrap
  }
  .stage-top{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:20px 22px 0}
  .new{background:var(--signal);color:#fff;font-size:.75rem;font-weight:700;border-radius:999px;padding:5px 12px}
  .new[hidden]{display:none}
  .stage-color{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.75);backdrop-filter:blur(10px);border-radius:999px;padding:5px 12px 5px 6px;font-size:.85rem;font-weight:600}
  .stage-color i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
  .stage-img{position:relative;z-index:1;flex:1;min-height:0}
  .stage-img img{position:absolute;inset:4% 10% 6%;width:80%;height:90%;object-fit:contain;filter:drop-shadow(0 30px 34px rgba(20,18,40,.25));transition:opacity .25s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
  .stage-img img.swap{opacity:0;transform:translateY(12px) scale(.97)}
  .stage-info{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:0 24px 22px}
  .stage-info h2{margin:0;font-size:clamp(1.5rem,2.6vw,2.1rem);letter-spacing:-.04em;line-height:1.05;font-weight:800}
  .stage-info p{margin:6px 0 0;color:var(--graphite);font-size:.95rem}
  .rating{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 4px 14px rgba(20,18,40,.08)}
  .rating .stars{color:var(--star);letter-spacing:1px}
  .rating b{font-weight:700}

  /* steps (right) */
  .panel{background:#fff;border-radius:32px;padding:10px;box-shadow:0 30px 60px -30px rgba(20,18,40,.3)}
  .step{padding:16px 16px 18px}
  .step + .step{border-top:1px solid var(--line)}
  .step-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
  .step-head h3{margin:0;display:flex;align-items:center;gap:10px;font-size:1.0625rem;font-weight:700;letter-spacing:-.02em}
  .step-head h3 span{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:.75rem;font-weight:700}
  .step-head em{font-style:normal;color:var(--graphite);font-size:.9rem;font-weight:500}

  .models{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
  .model{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:transparent;border:1.5px solid transparent;border-radius:16px;padding:6px 12px 6px 6px;transition:background .15s,border-color .15s}
  .model:hover{background:var(--soft)}
  .model[aria-checked="true"]{border-color:var(--ink);background:#fff}
  .model .thumb{width:50px;height:50px;border-radius:14px;background:var(--soft);padding:5px;flex:none}
  .model .thumb img{width:100%;height:100%;object-fit:contain;display:block}
  .model .txt{flex:1;min-width:0}
  .model strong{display:flex;align-items:center;gap:8px;font-size:.98rem;font-weight:700;letter-spacing:-.015em}
  .model strong small{font-size:.68rem;font-weight:700;color:var(--signal);background:rgba(27,77,255,.1);padding:2px 7px;border-radius:999px}
  .model .txt > span{display:block;color:var(--graphite);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .model .radio{width:20px;height:20px;border-radius:50%;border:2px solid #cfcdd6;flex:none;transition:border .15s}
  .model[aria-checked="true"] .radio{border:6px solid var(--ink)}
  .model.hidden{display:none}

  .swatches{display:flex;gap:10px;flex-wrap:wrap}
  .swatch{width:42px;height:42px;padding:0;border-radius:50%;border:1px solid rgba(22,20,28,.18);box-shadow:inset 0 0 0 3px #fff;transition:box-shadow .15s,transform .15s}
  .swatch:hover{transform:scale(1.06)}
  .swatch[aria-checked="true"]{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--ink)}

  .storages{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
  .storage{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 8px;font-weight:700;font-size:.98rem;transition:border-color .15s,color .15s,background .15s}
  .storage:hover{border-color:#bdbbc6}
  .storage[aria-checked="true"]{border-color:var(--signal);color:var(--signal);background:rgba(27,77,255,.05)}

  .summary{margin:6px;padding:16px;border-radius:24px;background:var(--soft);display:flex;flex-direction:column;gap:12px}
  .summary-line{display:flex;justify-content:space-between;gap:12px;font-size:.92rem}
  .summary-line b{font-weight:700;letter-spacing:-.01em}
  .summary-line span{color:var(--graphite);text-align:right}
  .add{width:100%;background:var(--signal);color:#fff;border:0;padding:16px;border-radius:16px;font-weight:700;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .2s}
  .add:hover{background:var(--signal-hover)}
  .add svg{width:18px;height:18px}
  .added{margin:0;text-align:center;font-size:.85rem;color:var(--ok);font-weight:600;min-height:1.3em}

  /* ================= cart drawer ================= */
  .drawer-scrim{position:fixed;inset:0;z-index:55;background:rgba(18,16,28,.4);opacity:0;pointer-events:none;transition:opacity .28s}
  .drawer-scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;z-index:60;background:#fff;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(18,16,28,.18);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}
  .drawer-head h2{margin:0;font-size:1.25rem;letter-spacing:-.03em;font-weight:800}
  .drawer-head h2 span{color:var(--graphite);font-weight:500}
  .x{width:36px;height:36px;border-radius:50%;background:var(--soft);border:0;display:grid;place-items:center;color:var(--graphite)}
  .x:hover{background:#e6e8ed;color:var(--ink)}
  .x svg{width:16px;height:16px}
  .items{flex:1;overflow:auto;padding:8px 22px}
  .empty{color:var(--graphite);text-align:center;padding:70px 12px;font-size:.9375rem}
  .empty svg{width:44px;height:44px;opacity:.35;margin-bottom:10px}
  .item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
  .item .thumb{width:64px;height:64px;border-radius:14px;background:var(--soft);padding:6px;flex:none}
  .item img{width:100%;height:100%;object-fit:contain;display:block}
  .item .info{flex:1;min-width:0}
  .item .info strong{display:block;font-weight:700;font-size:.98rem}
  .item .info span{color:var(--graphite);font-size:.875rem}
  .remove{background:transparent;border:0;color:var(--graphite);font-size:.8125rem;padding:4px 0;text-decoration:underline;text-underline-offset:2px}
  .remove:hover{color:#c62828}
  .drawer-foot{padding:20px 22px;border-top:1px solid var(--line)}
  .foot-note{display:flex;align-items:center;gap:8px;margin:0 0 14px;color:var(--graphite);font-size:.875rem}
  .foot-note svg{width:18px;height:18px;color:var(--ok);flex:none}
  .primary{width:100%;background:var(--ink);color:#fff;border:0;padding:15px;border-radius:14px;font-weight:700;font-size:1rem;transition:background .2s}
  .primary:hover{background:#2c2934}
  .primary[disabled]{opacity:.35;cursor:not-allowed}

  /* ================= order placed ================= */
  .scrim{position:fixed;inset:0;z-index:70;background:rgba(18,16,28,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:20px}
  .scrim.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:26px;box-shadow:0 30px 70px rgba(18,16,28,.35);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .delivery{position:relative;height:170px;margin:0 0 14px;overflow:hidden}
  .road{position:absolute;left:0;right:0;bottom:34px;height:3px;background:#e6e8ed;border-radius:2px}
  .road::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#b9bec6 0 18px,transparent 18px 40px);animation:road .5s linear infinite}
  @keyframes road{to{background-position:-40px 0}}
  .van{position:absolute;bottom:24px;left:50%;width:150px;margin-left:-75px;animation:drive 2.6s cubic-bezier(.3,.85,.3,1) forwards}
  .van img{width:100%;display:block}
  @keyframes drive{0%{transform:translateX(-260px)}38%{transform:translateX(0)}62%{transform:translateX(0)}100%{transform:translateX(320px)}}
  .parcel{position:absolute;bottom:30px;left:50%;margin-left:22px;width:34px;height:30px;border-radius:4px;background:#f97316;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12);opacity:0;animation:drop 2.6s linear forwards}
  .parcel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:rgba(255,255,255,.55)}
  @keyframes drop{0%,45%{opacity:0;transform:translateY(-26px)}55%{opacity:1;transform:translateY(0)}100%{opacity:1;transform:translateY(0)}}
  .status{text-align:center}
  .status h2{margin:0 0 6px;font-weight:800;letter-spacing:-.03em}
  .status p{margin:0;color:var(--graphite);font-size:.9375rem}
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

  /* ================= responsive ================= */
  @media (max-width:980px){
    .bar{grid-template-columns:1fr auto}
    .bar .filters{display:none}
    .mobile-filters{display:flex!important}
  }
  .mobile-filters{display:none;max-width:var(--shell);margin:0 auto;padding:0 20px 14px;overflow-x:auto;scrollbar-width:none}
  .mobile-filters::-webkit-scrollbar{display:none}
  .mobile-filters .filters{flex:none}
  @media (max-width:860px){
    .shop{grid-template-columns:minmax(0,1fr)}
    .stage{position:relative;top:0;height:min(120vw,540px);min-height:420px}
    .big-num{font-size:min(70vw,22rem)}
  }
  @media (max-width:520px){
    .wordmark span{display:none}
    .intro{padding-top:24px}
    .perks{display:none}
    .stage{border-radius:26px}
    .stage-info{padding:0 18px 18px;gap:10px}
    .rating .stars{display:none}
    .rating b::before{content:"★ ";color:var(--star)}
    .stage-img img{inset:4% 6% 4%;width:88%;height:92%}
    .panel{border-radius:26px}
    .step{padding:16px 10px 18px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    .van{transform:none}
    .parcel{opacity:1}
  }

  /* ================= background themes ================= */
  :root{
    --page-bg:linear-gradient(135deg,#fde4d3 0%,#f8d3e2 48%,#ddd6fb 100%);
    --page-base:#f8d9e2;
    --on-bg:#1d1420;--on-bg-muted:#5e4f60;
    --chip-bg:rgba(255,255,255,.5);--chip-line:rgba(255,255,255,.85);
    --chip-on-bg:#1d1420;--chip-on-fg:#fff;
    --bar-bg:rgba(255,255,255,.55);--bar-line:rgba(29,20,32,.08);--bar-ink:#1d1420;--bar-muted:#6d5e70;
    --cart-bg:#1d1420;--cart-fg:#fff;--cart-hover:#3a2e3d;
  }
  body[data-theme="mint"]{
    --page-bg:linear-gradient(140deg,#d7f7ea 0%,#cdeefa 55%,#d9e4ff 100%);--page-base:#d2f0f2;
    --on-bg:#0f2a2a;--on-bg-muted:#3f5d5c;--chip-on-bg:#0f2a2a;
    --bar-line:rgba(15,42,42,.08);--bar-ink:#0f2a2a;--bar-muted:#4d6a69;--cart-bg:#0f2a2a;--cart-hover:#1f4040;
  }
  body[data-theme="honey"]{
    --page-bg:linear-gradient(135deg,#fff3c4 0%,#ffdcb0 50%,#ffc9c2 100%);--page-base:#ffdcb8;
    --on-bg:#2b1a0a;--on-bg-muted:#6a4c2e;--chip-on-bg:#2b1a0a;
    --bar-line:rgba(43,26,10,.08);--bar-ink:#2b1a0a;--bar-muted:#7a5a3a;--cart-bg:#2b1a0a;--cart-hover:#48321c;
  }
  body[data-theme="sky"]{
    --page-bg:linear-gradient(160deg,#e3eeff 0%,#cfdcff 45%,#e6dcff 100%);--page-base:#d8e0ff;
    --on-bg:#111a33;--on-bg-muted:#47547a;--chip-on-bg:#111a33;
    --bar-line:rgba(17,26,51,.08);--bar-ink:#111a33;--bar-muted:#55628a;--cart-bg:#1b4dff;--cart-hover:#1740d6;
  }
  body[data-theme="night"]{
    --page-bg:linear-gradient(150deg,#0e1330 0%,#2a1f5c 52%,#4b1d5e 100%);--page-base:#231a4a;
    --on-bg:#f4f1ff;--on-bg-muted:rgba(236,232,255,.74);
    --chip-bg:rgba(255,255,255,.07);--chip-line:rgba(255,255,255,.14);
    --chip-on-bg:#fff;--chip-on-fg:#1a1440;
    --bar-bg:rgba(14,12,40,.55);--bar-line:rgba(255,255,255,.1);--bar-ink:#fff;--bar-muted:rgba(236,232,255,.66);
    --cart-bg:#fff;--cart-fg:#1a1440;--cart-hover:#e6e2ff;
  }
  body[data-theme="ocean"]{
    --page-bg:linear-gradient(155deg,#062a33 0%,#0b4d58 50%,#16366e 100%);--page-base:#0b3f50;
    --on-bg:#eefcff;--on-bg-muted:rgba(224,246,250,.76);
    --chip-bg:rgba(255,255,255,.07);--chip-line:rgba(255,255,255,.14);
    --chip-on-bg:#fff;--chip-on-fg:#06303a;
    --bar-bg:rgba(4,30,38,.55);--bar-line:rgba(255,255,255,.1);--bar-ink:#fff;--bar-muted:rgba(224,246,250,.66);
    --cart-bg:#fff;--cart-fg:#06303a;--cart-hover:#dff4f7;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--page-bg)}
  body.theme-fade::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--prev-bg);animation:bgfade .45s ease forwards;pointer-events:none}
  @keyframes bgfade{to{opacity:0}}
  .intro h1,.intro p,.perks,.chip{transition:color .35s ease,background-color .35s ease}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="wordmark">
      <svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true"><rect x="1" y="1" width="16" height="20" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="6" y="3.5" width="6" height="1.6" rx=".8" fill="currentColor"/></svg>

const $ = s => document.querySelector(s);
let cart = [];
let sel = { model: MODELS[0], color: 0, storage: 0 };

/* ---------- model list ---------- */
$('#models').innerHTML = MODELS.map(m => `
  <li><button class="model" role="radio" data-model="${m.id}" data-series="${m.series}" aria-checked="false">
    <span class="thumb"><img src="${m.colors[0].img}" alt=""></span>
    <span class="txt">
      <strong>${m.name}${m.isNew ? ' <small>New</small>' : ''}</strong>
      <span>${m.tagline}</span>
    </span>
    <span class="radio" aria-hidden="true"></span>
  </button></li>`).join('');

$('#models').addEventListener('click', e => {
  const b = e.target.closest('.model');
  if (!b) return;
  const m = MODELS.find(x => x.id === b.dataset.model);
  if (m === sel.model) return;
  sel = { model: m, color: 0, storage: 0 };
  render(true);
  if (matchMedia('(max-width:860px)').matches) $('#stage').scrollIntoView({ behavior: 'smooth', block: 'start' });
});

$('#swatches').addEventListener('click', e => {
  const b = e.target.closest('.swatch');
  if (!b || +b.dataset.i === sel.color) return;
  sel.color = +b.dataset.i;
  render(true);
});

$('#storages').addEventListener('click', e => {
  const b = e.target.closest('.storage');
  if (!b) return;
  sel.storage = +b.dataset.i;
  render(false);
});

/* ---------- render ---------- */
function render(swapImage){
  const m = sel.model, c = m.colors[sel.color], s = m.storage[sel.storage];

  document.querySelectorAll('.model').forEach(b => {
    b.setAttribute('aria-checked', String(b.dataset.model === m.id));
    if (b.dataset.model === m.id) b.querySelector('.thumb img').src = c.img;
  });

  $('#swatches').innerHTML = m.colors.map((col, i) => `
    <button class="swatch" role="radio" data-i="${i}" style="background:${col.hex}"
            aria-checked="${i === sel.color}" aria-label="${col.name}" title="${col.name}"></button>`).join('');
  $('#colorName').textContent = c.name;

  $('#storages').innerHTML = m.storage.map((st, i) => `
    <button class="storage" role="radio" data-i="${i}" aria-checked="${i === sel.storage}">${st}</button>`).join('');
  $('#storageName').textContent = s;

  $('#sumName').textContent = m.name;
  $('#sumSpec').textContent = c.name + ' · ' + s;

  // stage
  const stage = $('#stage');
  stage.style.setProperty('--tint', c.glow || c.hex);
  $('#bigNum').textContent = m.series;
  $('#stageNew').hidden = !m.isNew;
  $('#stageDot').style.background = c.hex;
  $('#stageColor').textContent = c.name;
  $('#stageName').textContent = m.name;
  $('#stageTag').textContent = m.tagline;
  $('#stageRating').textContent = RATING;

  const img = $('#stageImg');
  const apply = () => { img.src = c.img; img.alt = m.name + ' in ' + c.name; img.classList.remove('swap'); };
  if (swapImage && img.src){ img.classList.add('swap'); setTimeout(apply, 180); }
  else apply();
}

/* ---------- filters (header + mobile copy stay in sync) ---------- */
function applyFilter(series){
  document.querySelectorAll('[data-filters] .chip').forEach(c => c.setAttribute('aria-pressed', String(c.dataset.series === series)));
  let firstVisible = null;
  document.querySelectorAll('.model').forEach(b => {
    const show = series === 'all' || b.dataset.series === series;
    b.closest('li').hidden = !show;
    if (show && !firstVisible) firstVisible = b.dataset.model;
  });
  const n = document.querySelectorAll('.models li:not([hidden])').length;
  $('#shown').textContent = n + (n === 1 ? ' model' : ' models');
  if (series !== 'all' && sel.model.series !== series){
    sel = { model: MODELS.find(x => x.id === firstVisible), color: 0, storage: 0 };
    render(true);
  }
}
document.querySelectorAll('[data-filters]').forEach(group => group.addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (chip) applyFilter(chip.dataset.series);
}));

/* ---------- add to cart ---------- */
let addedTimer;
$('#addToCart').addEventListener('click', () => {
  const m = sel.model, c = m.colors[sel.color];
  cart.push({ name: m.name, color: c.name, img: c.img, storage: m.storage[sel.storage] });
  renderCart();
  const cnt = $('#count'); cnt.classList.remove('bump'); void cnt.offsetWidth; cnt.classList.add('bump');
  $('#added').textContent = 'Added to cart';
  clearTimeout(addedTimer); addedTimer = setTimeout(() => $('#added').textContent = '', 2200);
  openDrawer();
});

/* ---------- cart ---------- */
function renderCart(){
  $('#count').textContent = cart.length;
  $('#cartCount').textContent = cart.length ? '(' + cart.length + ')' : '';
  $('#checkout').disabled = cart.length === 0;
  $('#items').innerHTML = cart.length
    ? cart.map((i, idx) => `
      <div class="item">
        <div class="thumb"><img src="${i.img}" alt="${i.name}"></div>
        <div class="info">
          <strong>${i.name}</strong>
          <span>${i.color} · ${i.storage} · ★ ${RATING}</span><br>
          <button class="remove" data-idx="${idx}">Remove</button>
        </div>
      </div>`).join('')
    : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><br>Your cart is empty<br>Pick a model to get started.</div>`;
}
$('#items').addEventListener('click', e => {
  const b = e.target.closest('.remove');
  if (!b) return;
  cart.splice(+b.dataset.idx, 1);
  renderCart();
});
function openDrawer(){ $('#drawer').classList.add('open'); $('#drawerScrim').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawerScrim').classList.remove('open'); }
$('#openCart').addEventListener('click', openDrawer);
$('#closeCart').addEventListener('click', closeDrawer);
$('#drawerScrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

/* ---------- checkout: confetti right away, no form ---------- */
$('#checkout').addEventListener('click', () => {
  closeDrawer();
  restartDelivery();
  $('#statusScrim').classList.add('open');
  launchConfetti(2800);
  setTimeout(() => {
    $('#statusScrim').classList.remove('open');
    cart = [];
    renderCart();
  }, 2800);
});
function restartDelivery(){
  const stage = $('#deliveryStage');
  const clone = stage.cloneNode(true);
  stage.parentNode.replaceChild(clone, stage);
  clone.id = 'deliveryStage';
}

/* ---------- confetti ---------- */
function launchConfetti(duration){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.getElementById('confetti')?.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'confetti';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  const colors = ['#1b4dff','#f5a300','#0f9d58','#e8467c','#8b5cf6','#f97316','#22c1c3'];
  const pieces = [];
  const density = Math.max(W / 900, .5);
  function add(y){
    pieces.push({
      x: Math.random() * W, y,
      vx: (Math.random() - .5) * 2.4, vy: 2 + Math.random() * 3,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .25,
      tilt: Math.random() * Math.PI * 2, sway: Math.random() * Math.PI * 2,
      color: colors[(Math.random() * colors.length) | 0],
      round: Math.random() < .3
    });
  }
  for (let i = 0; i < 160 * density; i++) add(Math.random() * H - H * .6);
  const start = performance.now();
  (function frame(now){
    const t = now - start;
    if (t < duration) for (let i = 0; i < 3 * density; i++) add(-20 - Math.random() * 40);
    ctx.clearRect(0, 0, W, H);
    for (let i = pieces.length - 1; i >= 0; i--){
      const p = pieces[i];
      p.vy = Math.min(p.vy + .06, 5.5);
      p.sway += .05;
      p.x += p.vx + Math.sin(p.sway) * .8;
      p.y += p.vy;
      p.rot += p.vr; p.tilt += .1;
      if (p.y > H + 30){ pieces.splice(i, 1); continue; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.tilt));
      ctx.fillStyle = p.color;
      if (p.round){ ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (pieces.length) requestAnimationFrame(frame);
    else canvas.remove();
  })(start);
}

  <button class="theme-opt" role="radio" data-theme="${t.id}" aria-checked="false">
    <i style="background:${t.bg}"></i>${t.name}
  </button>`).join('');
function setTheme(id, animate){
  const t = THEMES.find(x => x.id === id) || THEMES[0];
  const current = THEMES.find(x => x.id === (document.body.dataset.theme || 'dawn'));
  if (animate && current && current.id !== t.id){
    document.body.style.setProperty('--prev-bg', current.bg);
    document.body.classList.remove('theme-fade');
    void document.body.offsetWidth;
    document.body.classList.add('theme-fade');
  }
  if (t.id === 'dawn') delete document.body.dataset.theme;
  else document.body.dataset.theme = t.id;
  document.querySelectorAll('.theme-opt').forEach(b => b.setAttribute('aria-checked', String(b.dataset.theme === t.id)));
  try { localStorage.setItem('store-theme', t.id); } catch (err) {}
}
let savedTheme = 'dawn';
try { savedTheme = localStorage.getItem('store-theme') || 'dawn'; } catch (err) {}
setTheme(savedTheme, false);
function toggleThemePop(force){
  const openNow = force ?? !$('#themePop').classList.contains('open');
  $('#themePop').classList.toggle('open', openNow);
  $('#themeBtn').setAttribute('aria-expanded', String(openNow));
}
$('#themeBtn').addEventListener('click', e => { e.stopPropagation(); toggleThemePop(); });
$('#themeGrid').addEventListener('click', e => {
  const b = e.target.closest('.theme-opt');
  if (b) setTheme(b.dataset.theme, true);
});
document.addEventListener('click', e => { if (!e.target.closest('.theme')) toggleThemePop(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleThemePop(false); });

applyFilter('all');
render(false);
renderCart();
</script>
</body>
</html>
